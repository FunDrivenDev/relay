# Strict on purpose: agents write most of the commands.
# `just lint` runs it; `just fmt` applies its formatters.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - gocritic
    - gosec
    - intrange
    - misspell
    - nilerr
    - nolintlint
    - paralleltest
    - perfsprint
    - revive
    - thelper
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags: [diagnostic, style, performance]
      disabled-checks:
        # Commands pass their params struct by value, as the run function receives it.
        - hugeParam
        - unnamedResult
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: early-return
        - name: unused-parameter
        - name: unexported-return
  exclusions:
    presets: [std-error-handling]
    rules:
      # Tests may write files with the permissions a stub needs.
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/FunDrivenDev/relay]
