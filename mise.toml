# Every tool needed to build, check and release relay, pinned; mise.lock records
# what they resolve to. Run them through the Justfile.

[tools]
go = "1.27.2"
golangci-lint = "2.14.0"
gofumpt = "0.12.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
just = "1.58.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
rumdl = "0.2.79"
typos = "1.51.1"
taplo = "0.10.0"
yamlfmt = "0.21.0"
gitleaks = "8.30.1"
goreleaser = "2.18.3"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64", "linux-arm64"]
